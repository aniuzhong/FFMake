match_names = [
    "libxvid",
]
system = "custom"
steps = [
    "cd {src}/build/generic && ./configure --prefix={prefix} && make -j{jobs} && rm -f {prefix}/lib/libxvidcore.so* && make install",
]
[source]
type = "tar"
url = "https://downloads.xvid.com/downloads/xvidcore-1.3.7.tar.gz"

[triplet_overrides.mingw-x86_64-llvm]
steps = [
    "cd {src}/build/generic && CC=x86_64-w64-mingw32-gcc ./configure --prefix={prefix} --host=x86_64-w64-mingw32 && make -j{jobs} && make install",
]
