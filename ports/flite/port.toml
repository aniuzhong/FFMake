match_names = [
    "flite",
    "libflite",
]
pc = "flite"
system = "custom"
steps = [
    "cd {src} && ./configure --prefix={prefix} --with-audio=none --enable-shared && sed -i 's/-lasound//' config/config",
    "cd {src} && make -j{jobs}",
    "cd {src} && make install",
]
pc_libs = [
    "-lflite",
    "-lm",
]

[source]
type = "tar"
url = "http://deb.debian.org/debian/pool/main/f/flite/flite_2.2.orig.tar.gz"
sha256 = "ab1555fe5adc3f99f1d4a1a0eb1596d329fd6d74f1464a0097c81f53c0cf9e5c"

[triplet_overrides.mingw-x86_64-llvm]
prefixup = "sed -i 's/^#define const$/#ifdef _WIN32\\n#include <windows.h>\\n#endif\\n#define const/' {src}/tools/find_sts_main.c && sed -i 's/^__inline int c99_/static __inline int c99_/' {src}/include/cst_file.h && sed -i 's/^inline /static inline /; s/^__inline /static __inline /' {src}/include/*.h && sed -i 's/^__inline int ts_utf8_sequence_length/int ts_utf8_sequence_length/' {src}/src/utils/cst_tokenstream.c && sed -i 's/static __inline int ts_utf8_sequence_length(char c0);/int ts_utf8_sequence_length(char c0);/' {src}/include/cst_tokenstream.h"
steps = [
    "cd {src} && ./configure --host=x86_64-w64-mingw32 --prefix={prefix} --with-audio=none --enable-shared && sed -i 's/i386-mingw32-/x86_64-w64-mingw32-/g' config/config config/system.mak",
    "cd {src} && make -j1",
    "cd {src} && mkdir -p {prefix}/include/flite {prefix}/lib && cp -f include/*.h {prefix}/include/flite/ && cp -f build/x86_64-mingw32/lib/*.a {prefix}/lib/",
]
