match_names = [
    "libmodplug",
]
pc = "libmodplug"
system = "makefile"
configure_args = []
make_args = [
    "LDFLAGS=-no-undefined",
]

[source]
type = "tar"
url = "https://sourceforge.net/projects/modplug-xmms/files/libmodplug/0.8.9.0/libmodplug-0.8.9.0.tar.gz/download"

[triplet_overrides.mingw-x86_64-llvm]
configure_args = [
    "CXXFLAGS=-O2 -Wno-register",
]
