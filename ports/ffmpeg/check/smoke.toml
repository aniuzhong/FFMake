# Smoke matrix, one-to-one with the enabled feature flags of each
# triplet: a case runs only when the built binary's configuration
# contains its flag. Kinds:
#   encode      lavfi source -> encoder -> non-empty output file
#               (optional args[] ride before the output path)
#   filter      lavfi source -> filter chain -> output (stream "a" -> -af)
#   decode      input produced by an EARLIER case in this file
#   capability  needle listed in `ffmpeg -<list>` output -- proves the
#               component compiled, linked and registered; used for all
#               hardware/device/protocol features that cannot open real
#               hardware in CI
# Every active --enable-* flag must map to a case here or to a waiver in
# the WAIVED section at the bottom; tools/smoke_coverage.py enforces it.

# ---- video encoders (real invocation) ------------------------------------
[[case]]
flag = "--enable-libx264"
name = "libx264-encode"
kind = "encode"
encoder = "libx264"
input = "testsrc2=duration=0.5:size=640x360:rate=30"
ext = "mp4"

[[case]]
flag = "--enable-libx265"
name = "libx265-encode"
