# ---- WAIVED flags (no case; each with a reason) --------------------------------
# --enable-gpl / --enable-version3 / --enable-nonfree
#     license switches, not runtime features.
# --enable-libxcb-shape / -shm / -xfixes
#     build variants of the same libxcb stack; the libxcb case (x11grab)
#     exercises the compiled path.
# --enable-librtmp
#     registers protocol names identical to the native RTMP stack, so a
#     listing cannot distinguish it; proven by the configuration line.
# --enable-libsnappy
#     internal compressor for the hap codec; no CLI surface.
# --enable-cairo / --enable-lcms2 / --enable-libklvanc
#     build-time support libraries; no CLI surface.
# --enable-libshaderc
#     transitive: the vulkan-static filter case exercises the GLSL->SPIRV
#     path that libshaderc feeds.
# --enable-sdl2 / --enable-opengl
#     upstream removed the corresponding output devices; nothing
#     registers under these flags in current FFmpeg.
# --enable-libxevd
#     DRIFT: configure accepts the flag, but no libxevd decoder is
#     registered in the built binary (only the native "evc" decoder).
#     Revisit: either the flag is inert upstream or the check path
#     silently passed. Tracked as a known issue.
