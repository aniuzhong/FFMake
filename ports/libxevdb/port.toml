reason = "EVC Baseline Profile variant of the same upstream as libxevd: ffmpeg probes it as a separate decoder via pkg-config name xevdb (same xevd.h/xevd_decode); built with the upstream -DSET_PROF=BASE switch"
match_names = [
    "xevdb",
    "libxevdb",
]
pc = "xevdb"
system = "cmake"
cmake_args = [
    "-DSET_PROF=BASE",
    "-DBUILD_SHARED_LIBS=ON",
]

