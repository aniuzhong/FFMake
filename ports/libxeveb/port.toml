reason = "EVC Baseline Profile variant of libxeve: ffmpeg probes pkg-config name xeveb (same xeve.h/xeve_encode); built with the upstream -DSET_PROF=BASE switch"
match_names = [
    "xeveb",
    "libxeveb",
]
pc = "xeveb"
system = "cmake"
cmake_args = [
    "-DSET_PROF=BASE",
    "-DBUILD_SHARED_LIBS=ON",
]

