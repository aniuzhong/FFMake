match_names = [
    "onnxruntime",
    "libonnxruntime",
]
pc = "onnxruntime"
system = "custom"
steps = [
    "mkdir -p {prefix}/include {prefix}/lib",
    "cp -a {src}/include/* {prefix}/include/",
    "cp -a {src}/lib/* {prefix}/lib/",
]
pc_libs = [
    "-lonnxruntime",
]

[source]
type = "tar"
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-linux-x64-1.29.0.tgz"

[triplet_overrides.mingw-x86_64-llvm]
steps = [
    "mkdir -p {prefix}/include {prefix}/lib {prefix}/bin",
    "cp -a {src}/include/* {prefix}/include/",
    "cp -a {src}/lib/* {prefix}/lib/",
    "cp -a {src}/lib/* {prefix}/bin/ 2>/dev/null || true",
]

[triplet_overrides.mingw-x86_64-llvm.source]
type = "tar"
url = "https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip"
