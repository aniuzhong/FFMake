platforms = [
    "linux",
]
match_names = [
    "libjack",
    "jack",
]
pc = "jack"
system = "custom"
steps = [
    "sed -i \"s/latin-1/utf-8/g\" {src}/waflib/*.py && sed -i -e \"s/^import os, re, imp, sys/import os, re, sys, types/\" -e \"s/imp\\\\.new_module/types.ModuleType/\" {src}/waflib/Context.py && cd {src} && python3 waf configure --prefix={prefix} --autostart=none && python3 waf build -j{jobs} && python3 waf install",
]

