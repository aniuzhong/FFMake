match_names = [
    "ladspa",
    "ladspa.h",
]
pc = "ladspa"
system = "custom"
steps = [
    "mkdir -p {prefix}/include && cp {src}/src/ladspa.h {prefix}/include/",
    "mkdir -p {prefix}/lib/pkgconfig && printf 'prefix={prefix}\\nlibdir={prefix}/lib\\nincludedir={prefix}/include\\n\\nName: ladspa\\nDescription: Linux Audio Developer Simple Plugin API\\nVersion: 1.17\\nCflags: -I{prefix}/include\\n' > {prefix}/lib/pkgconfig/ladspa.pc",
]

[source]
type = "tar"
url = "https://www.ladspa.org/download/ladspa_sdk_1.17.tgz"
sha256 = "27d24f279e4b81bd17ecbdcc38e4c42991bb388826c0b200067ce0eb59d3da5b"
