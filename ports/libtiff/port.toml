match_names = [
    "libtiff-4",
    "libtiff",
    "tiff",
]
pc = "libtiff-4"
system = "makefile"
needs = [
    "zlib",
    "libjpeg-turbo",
    "libdeflate",
    "liblerc",
]
configure_args = [
    "--disable-static",
    "--enable-shared",
    "--disable-webp",
    "--disable-zstd",
    "--disable-lzma",
    "--disable-jbig",
]
make_args = [
    "LDFLAGS=-no-undefined",
]

[source]
type = "tar"
url = "https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz"
sha256 = "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a"
