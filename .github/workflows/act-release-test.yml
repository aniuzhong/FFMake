name: act-release-test
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'run full build (slow: hours)'
        type: boolean
        default: false
      triplet:
        description: 'triplet for full build'
        type: string
        default: 'linux-x86_64'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: L0 environment self-check
        run: python3 -m auto_build probe
      - name: port inventory
        run: |
          python3 -m auto_build port list > /tmp/ports.txt
          echo "== Baseline reference lines (all missing are expected; see Dockerfile baseline) =="
          echo "  cairo/opengl  = system-pc borrows from host, no sysroot entry → always missing in port list, but actually enabled in product"
          echo "  fftw3         = not requested by flags (stateful)"
          grep -E "\b(cairo|opengl|smbclient|fftw3)\b" /tmp/ports.txt || true
          echo "== Overview (first 25 lines) =="
          head -25 /tmp/ports.txt
      - name: distfiles inventory
        run: |
          n=$(ls workspace/distfiles 2>/dev/null | wc -l)
          echo "cached distfiles: $n"
  full-build:
    if: ${{ inputs.full == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m auto_build all --triplet ${{ inputs.triplet }}
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: ffmpeg-${{ inputs.triplet }}
          path: workspace/out/${{ inputs.triplet }}/bin/
