name: release

# Deliberately manual while the build pipeline stabilizes. To cut a release
# later, either restore the tag trigger below (push tags: ['v*']) or dispatch
# with the intended tag ref.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        triplet: [linux-x86_64, mingw-x86_64-llvm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build + install + smoke test
        run: python3 -m auto_build all --triplet ${{ matrix.triplet }}

      - name: assemble redistributable package
        run: python3 ffmake.py dist --triplet ${{ matrix.triplet }}

      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: ffmpeg-${{ matrix.triplet }}
          path: release/ffmpeg-*-${{ matrix.triplet }}*
          if-no-files-found: error

  publish:
    if: ${{ !env.ACT }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum ffmpeg-*.tar.xz ffmpeg-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ffmpeg-*.tar.xz
            dist/ffmpeg-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
