name: docker

# Publish the CI image to GHCR so GH-hosted build jobs can run inside the
# same capability surface as local act runs (feed layers, wine, rust).
# Proxy-free: GH runners reach everything directly.

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ffmake-ci

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:24.04
            ${{ env.IMAGE }}:24.04-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
